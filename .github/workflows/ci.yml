name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest --cov=south_asian_cuisine_rag --cov-report=term-missing
      - name: Validate corpus
        run: rag-cuisine validate-corpus
      - name: Validate recorded release baseline
        run: python scripts/check_evaluation.py data/evaluation/baseline_v2.json
